databases:
  - name: cloudshell-db
    databaseName: cloudshell
    user: cloudshell
    plan: free
    region: frankfurt

services:
  # Backend API
  - type: web
    name: cloudshell-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: src/backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudshell-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: cloudshell-frontend
    runtime: static
    rootDir: src/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cloudshell-backend.onrender.com  # Update after backend deploys
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
